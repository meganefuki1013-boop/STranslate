name: Build Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Build
      shell: pwsh
      run: |
        .\build.ps1 2.0.0 | Tee-Object -FilePath build.log
        # build.ps1 不会因编译失败而退出，这里显式检查
        if (Select-String -Path build.log -Pattern 'Build FAILED' -Quiet) { exit 1 }

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: STranslate-win-x64
        path: src/.artifacts/Release/

    - name: Upload Gemini plugin only
      uses: actions/upload-artifact@v4
      with:
        name: Gemini-plugin-only
        path: src/.artifacts/Release/Plugins/STranslate.Plugin.Translate.Gemini/
        if-no-files-found: error
