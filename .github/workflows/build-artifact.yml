name: Build Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Build
      shell: pwsh
      run: .\build.ps1 2.0.0

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: STranslate-win-x64
        path: src/.artifacts/Release/

    - name: Collect Gemini plugin
      shell: pwsh
      run: |
        $dll = Get-ChildItem -Path src/.artifacts -Recurse -Filter STranslate.Plugin.Translate.Gemini.dll |
          Where-Object { Test-Path (Join-Path $_.DirectoryName 'plugin.json') } |
          Select-Object -First 1
        if (-not $dll) { throw "Gemini plugin output not found" }
        Write-Host "Found: $($dll.DirectoryName)"
        New-Item -ItemType Directory -Force gemini-plugin | Out-Null
        Copy-Item -Path (Join-Path $dll.DirectoryName '*') -Destination gemini-plugin -Recurse -Force

    - name: Upload Gemini plugin only
      uses: actions/upload-artifact@v4
      with:
        name: Gemini-plugin-only
        path: gemini-plugin/
        if-no-files-found: error
